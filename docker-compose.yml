services:
  app:
    build: ./app
    restart: unless-stopped
    env_file: .env
    volumes:
      - appdata:/data
    expose:
      - "8000"

  caddy:
    image: caddy:2.8
    restart: unless-stopped
    depends_on: [app]
    ports:
      - "80:80"
      - "443:443"
    environment:
      - DOMAIN=${DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  appdata:
  caddy_data:
  caddy_config:
